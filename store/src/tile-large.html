<!doctype html>
<html><head><meta charset="utf-8"><title>Large promotional tile</title><style>
*{box-sizing:border-box}html,body{margin:0}
body{width:1400px;height:560px;overflow:hidden;position:relative;background:linear-gradient(135deg,#1976d2 0%,#0b3d91 100%);font-family:"Segoe UI",system-ui,sans-serif;color:#fff}
body::before{content:"";position:absolute;right:-140px;top:-200px;width:620px;height:620px;border-radius:50%;background:rgba(255,143,0,.2)}
body::after{content:"";position:absolute;left:-120px;bottom:-240px;width:480px;height:480px;border-radius:50%;background:rgba(255,255,255,.06)}
.l{position:absolute;left:90px;top:80px;width:760px}
.l img{width:150px;height:150px;filter:drop-shadow(0 10px 18px rgba(0,0,0,.4))}
h1{margin:18px 0 6px;font-size:68px;font-weight:800;letter-spacing:.3px;line-height:1.05}
p{margin:0 0 22px;font-size:27px;opacity:.93}
.b{display:flex;gap:12px;flex-wrap:wrap}
.b span{padding:8px 18px;border-radius:24px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);font-size:19px;font-weight:600}
.by{position:absolute;left:92px;bottom:34px;font-size:17px;opacity:.85;letter-spacing:.05em}
.pop{position:absolute;right:130px;top:34px;width:340px;height:650px;border-radius:16px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.5);transform:rotate(3deg)}
.pop iframe{border:0;width:340px;height:650px;display:block}
</style></head><body>
<div class="l"><img src="../../extension/icons/logo.png" alt=""><h1>Job Auto Filler</h1><p>Fill job application forms in one click.</p>
<div class="b"><span>Offline-first</span><span>English + বাংলা</span><span>Smart field matching</span><span>Optional Gemini AI</span></div></div>
<div class="by">Powered by <b>Corvas</b></div>
<div class="pop"><iframe src="../../extension/popup/_store.html"></iframe></div>
</body></html>
