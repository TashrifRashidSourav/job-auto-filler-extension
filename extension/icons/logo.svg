<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Job Auto Filler by Corvas">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#43a047"/>
      <stop offset="1" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="256" rx="112" fill="url(#shine)"/>
  <!-- the "C" of Corvas -->
  <path d="M362.07 362.07 A150 150 0 1 1 362.07 149.93" fill="none" stroke="#ffffff" stroke-width="52" stroke-linecap="round"/>
  <!-- the tick: a completed form field -->
